<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تدبير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBk31eKaE7oiK5q6Fv4c3EugT3hGh24fYk",
  authDomain: "smart-flousi.firebaseapp.com",
  projectId: "smart-flousi",
  storageBucket: "smart-flousi.firebasestorage.app",
  messagingSenderId: "405513983927",
  appId: "1:405513983927:web:69f529541948055c14fa32",
  measurementId: "G-PJVK18C44Y"
};

const app   = initializeApp(firebaseConfig);
const auth  = getAuth(app);
const db    = getFirestore(app);
const provider = new GoogleAuthProvider();

// ── Expose to global scope ──
window._fbAuth     = auth;
window._fbDb       = db;
window._fbProvider = provider;
window._fbDoc      = doc;
window._fbSetDoc   = setDoc;
window._fbGetDoc   = getDoc;
window._fbOnSnapshot = onSnapshot;
window._fbSignIn   = ()=>signInWithPopup(auth,provider);
window._fbSignOut  = ()=>signOut(auth);

// ── Auth state listener ──
onAuthStateChanged(auth, user=>{
  window._fbUser = user;
  if(typeof window.onFbAuthChange === 'function') window.onFbAuthChange(user);
});
</script>
<style>
:root{--mint:#7EC8B0;--mint-l:#C8EAE0;--mint-ll:#EAF7F3;--sage:#A8C5A0;--peach:#E8A598;--peach-l:#F5D5CF;--lav:#B5A8D4;--lav-l:#E8E2F5;--blue:#8DB4CF;--blue-l:#D0E6F5;--gold:#D4A853;--gold-l:#F5E8C8;--dark:#2D3142;--mid:#5A6070;--light:#9AA0B0;--bg:#F8F9FB;--card:#FFFFFF;--border:#E8EAEF;--shadow:0 2px 16px rgba(45,49,66,.07);--shadow-h:0 8px 32px rgba(45,49,66,.14);--r:16px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;}
#pin-screen{position:fixed;inset:0;background:linear-gradient(135deg,#2D3142,#1a1f30);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
#pin-screen.hidden{display:none;}
.pin-logo{width:70px;height:70px;background:linear-gradient(135deg,var(--mint),var(--sage));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:12px;}
.pin-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:3px;}
.pin-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:4px;text-align:center;}
.pin-lang-row{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
.plb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 12px;color:rgba(255,255,255,.55);cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;font-family:'Tajawal',sans-serif;}
.plb:hover,.plb.active{background:var(--mint);border-color:var(--mint);color:var(--dark);}
.pin-dots{display:flex;gap:14px;margin:16px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:all .2s;}
.pin-dot.filled{background:var(--mint);border-color:var(--mint);}
.pin-dot.error{background:#E8A598;border-color:#E8A598;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:256px;}
.pin-btn{height:64px;border-radius:14px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Tajawal',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pin-btn:active{background:rgba(255,255,255,.2);transform:scale(.94);}
.pin-btn .sub{font-size:8px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.pin-btn.del{background:rgba(232,165,152,.12);color:#E8A598;}
.pin-btn.empty{background:none;cursor:default;}
.pin-error-msg{color:#E8A598;font-size:12px;margin-top:10px;min-height:18px;font-weight:600;text-align:center;}
.pin-setup-note{color:rgba(255,255,255,.3);font-size:11px;margin-top:8px;text-align:center;max-width:240px;line-height:1.6;}
.pin-forgot{color:var(--mint);font-size:12px;margin-top:8px;cursor:pointer;text-decoration:underline;}
.header{background:var(--dark);padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,.18);}
.brand{display:flex;align-items:center;gap:8px;}
.brand-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--mint),var(--sage));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.brand-name{font-size:16px;font-weight:800;color:#fff;}
.brand-sub{font-size:9px;color:var(--mint);margin-top:-2px;}
.header-right{display:flex;align-items:center;gap:6px;}
.month-nav{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px 7px;}
.month-nav button{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:14px;padding:2px 3px;line-height:1;}
.month-label{font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;color:#fff;min-width:88px;text-align:center;cursor:pointer;}
.month-label:hover{color:var(--mint);}
.new-month-btn{background:var(--mint);border:none;border-radius:7px;padding:4px 9px;font-family:'Tajawal',sans-serif;font-size:10px;font-weight:700;color:var(--dark);cursor:pointer;white-space:nowrap;}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:4px 7px;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;line-height:1;}
.hdr-select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:3px 6px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;color:#fff;cursor:pointer;}
.hdr-select option{color:var(--dark);background:#fff;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;}
.modal-title{font-size:14px;font-weight:800;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--light);}
.year-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.year-nav button{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;}
.months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.month-btn{padding:9px 4px;border-radius:9px;border:2px solid var(--border);background:var(--bg);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:600;color:var(--mid);transition:all .18s;text-align:center;position:relative;}
.month-btn:hover{border-color:var(--mint);color:var(--dark);}
.month-btn.active{background:var(--mint);border-color:var(--mint);color:var(--dark);}
.month-btn.has-data::after{content:'';position:absolute;top:4px;left:4px;width:5px;height:5px;background:var(--sage);border-radius:50%;}
.month-btn.active.has-data::after{background:var(--dark);}
.nm-option{display:flex;align-items:center;gap:9px;padding:10px 12px;border:2px solid var(--border);border-radius:11px;cursor:pointer;margin-bottom:7px;transition:all .18s;}
.nm-option:hover,.nm-option.selected{border-color:var(--mint);background:var(--mint-ll);}
.nm-icon{font-size:20px;flex-shrink:0;}
.nm-text strong{display:block;font-size:12px;font-weight:700;}
.nm-text span{font-size:10px;color:var(--light);}
.modal-btn{width:100%;padding:11px;background:var(--mint);border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--dark);cursor:pointer;margin-top:5px;}
.backup-section{margin-bottom:13px;}
.backup-section h3{font-size:11px;font-weight:700;color:var(--dark);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.backup-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:600;color:var(--dark);margin-bottom:6px;transition:all .18s;}
.backup-btn:hover{border-color:var(--mint);background:var(--mint-ll);}
.bicon{font-size:18px;flex-shrink:0;}
.btxt span{display:block;font-size:9px;color:var(--light);font-weight:400;}
.drive-steps{background:var(--bg);border-radius:10px;padding:11px;margin-top:7px;}
.drive-step{display:flex;gap:8px;margin-bottom:7px;font-size:11px;line-height:1.5;}
.drive-step:last-child{margin-bottom:0;}
.step-num{width:19px;height:19px;background:var(--mint);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--dark);flex-shrink:0;margin-top:2px;}
.pin-setting-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.toggle{width:38px;height:20px;background:var(--border);border-radius:10px;cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0;}
.toggle.on{background:var(--mint);}
.toggle::after{content:'';position:absolute;top:3px;right:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(-18px);}
.last-backup{font-size:9px;color:var(--light);text-align:center;margin-top:6px;}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.lang-opt{display:flex;align-items:center;gap:9px;padding:11px 12px;border:2px solid var(--border);border-radius:11px;cursor:pointer;transition:all .18s;}
.lang-opt:hover{border-color:var(--mint);}
.lang-opt.active{border-color:var(--mint);background:var(--mint-ll);}
.lang-flag{font-size:22px;}
.lang-name{font-size:12px;font-weight:700;}
.lang-native{font-size:10px;color:var(--light);}
.nav-tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;display:flex;gap:2px;overflow-x:auto;}
.nav-tab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--light);border-bottom:3px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;}
.nav-tab:hover{color:var(--dark);}
.nav-tab.active{color:var(--dark);border-bottom-color:var(--mint);}
.main{padding:14px 16px;max-width:1440px;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px;}
.kpi-card{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 12px 12px 0;}
.kpi-card.income::before{background:var(--sage);}.kpi-card.bills::before{background:var(--peach);}
.kpi-card.expenses::before{background:var(--lav);}.kpi-card.savings::before{background:var(--blue);}
.kpi-card.debts::before{background:var(--gold);}.kpi-card.remaining::before{background:var(--mint);}
.kpi-icon{font-size:16px;margin-bottom:5px;}
.kpi-label{font-size:9px;color:var(--light);font-weight:500;margin-bottom:3px;}
.kpi-value{font-size:16px;font-weight:800;color:var(--dark);letter-spacing:-.5px;line-height:1;}
.kpi-cur{font-size:9px;font-weight:500;color:var(--light);margin-right:2px;}
.kpi-progress{margin-top:6px;height:3px;background:var(--border);border-radius:3px;overflow:hidden;}
.kpi-bar{height:100%;border-radius:3px;transition:width .8s ease;}
.kpi-card.income .kpi-bar{background:var(--sage);}.kpi-card.bills .kpi-bar{background:var(--peach);}
.kpi-card.expenses .kpi-bar{background:var(--lav);}.kpi-card.savings .kpi-bar{background:var(--blue);}
.kpi-card.debts .kpi-bar{background:var(--gold);}.kpi-card.remaining .kpi-bar{background:var(--mint);}
.kpi-pct{font-size:9px;color:var(--light);margin-top:2px;}
.charts-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px;}
.remaining-hero{background:linear-gradient(135deg,#2D3142,#3D4260);border-radius:var(--r);padding:18px;color:#fff;box-shadow:var(--shadow-h);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.remaining-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(126,200,176,.2) 0%,transparent 70%);pointer-events:none;}
.rh-label{font-size:10px;color:rgba(255,255,255,.4);margin-bottom:2px;}
.rh-title{font-size:12px;font-weight:700;color:var(--mint);margin-bottom:11px;}
.rh-amount{font-size:34px;font-weight:800;letter-spacing:-2px;line-height:1;color:#fff;}
.rh-cur{font-size:12px;color:rgba(255,255,255,.3);margin-right:3px;}
.rh-sub{font-size:9px;color:rgba(255,255,255,.25);margin-top:4px;}
.rh-donut{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:85px;height:85px;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;transition:box-shadow .2s;}
.card:hover{box-shadow:var(--shadow-h);}
.card-header{padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.card-total{font-size:11px;font-weight:700;font-family:'DM Mono',monospace;}
.chart-wrap{padding:12px;}
.chart-wrap canvas{max-height:180px;}
.tables-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.mini-table{width:100%;border-collapse:collapse;}
.mini-table th{font-size:9px;font-weight:600;color:var(--light);padding:5px 10px;text-align:right;background:var(--bg);border-bottom:1px solid var(--border);}
.mini-table td{padding:6px 10px;font-size:11px;border-bottom:1px solid var(--border);vertical-align:middle;}
.mini-table tr:last-child td{border-bottom:none;}
.mini-table tr:hover td{background:var(--bg);}
.mini-table .lc{font-weight:500;text-align:right;}
.mini-table .ac,.mini-table .pc{text-align:left;font-family:'DM Mono',monospace;font-size:10px;color:var(--mid);}
.mini-table .pc{color:var(--light);}
/* note-row: rows coming from notes — shown in expenses table */
.mini-table .note-row td{background:#f0faf6;color:var(--mid);font-style:italic;}
.mini-table .note-row td:first-child::before{content:'📝 ';font-style:normal;}
.mini-table input[type=number]{background:transparent;border:none;font-family:'DM Mono',monospace;font-size:10px;width:62px;text-align:left;color:var(--dark);padding:2px;border-radius:3px;outline:none;}
.mini-table input[type=number]:focus{background:var(--mint-ll);}
.mini-table input[type=text]{background:transparent;border:none;font-family:'Tajawal',sans-serif;font-size:11px;width:100%;text-align:right;color:var(--dark);padding:2px;border-radius:3px;outline:none;}
.mini-table input[type=text]:focus{background:var(--bg);}
.add-btn{display:flex;align-items:center;gap:4px;padding:7px 10px;font-size:10px;font-weight:600;color:var(--mint);background:none;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;border-top:1px solid var(--border);width:100%;transition:background .15s;}
.add-btn:hover{background:var(--mint-ll);}
.notes-table{width:100%;border-collapse:collapse;}
.notes-table th{font-size:9px;color:var(--light);padding:5px 10px;text-align:right;background:var(--bg);border-bottom:1px solid var(--border);font-weight:600;}
.notes-table td{padding:6px 10px;font-size:11px;border-bottom:1px solid var(--border);vertical-align:middle;}
.notes-table tr:last-child td{border-bottom:none;}
.notes-table tr:hover td{background:var(--bg);}
.notes-table input{border:none;font-family:'DM Mono',monospace;font-size:11px;outline:none;background:transparent;}
.notes-table input[type=text]{font-family:'Tajawal',sans-serif;font-size:12px;}
.notes-table input:focus{background:var(--bg);border-radius:3px;}
/* MOBILE NOTES CARDS */
.note-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);display:none;}
.note-card-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.note-card-label{font-size:10px;color:var(--light);min-width:52px;font-weight:600;}
.note-card input[type=date],.note-card input[type=number]{border:none;background:var(--bg);border-radius:7px;padding:5px 9px;font-family:'DM Mono',monospace;font-size:12px;outline:none;width:100%;}
.note-card input[type=text]{border:none;background:var(--bg);border-radius:7px;padding:5px 9px;font-family:'Tajawal',sans-serif;font-size:12px;outline:none;width:100%;}
.note-card select{border:none;background:var(--bg);border-radius:7px;padding:5px 9px;font-family:'Tajawal',sans-serif;font-size:12px;outline:none;width:100%;cursor:pointer;}
.note-card-del{background:none;border:none;color:#ddd;cursor:pointer;font-size:16px;padding:4px;flex-shrink:0;}
.note-amount-big{font-size:18px;font-weight:800;font-family:'DM Mono',monospace;color:var(--dark);}
@media(max-width:700px){
  .notes-table,.notes-table thead,.notes-table tbody,.notes-table tr{display:none!important;}
  .note-card{display:block;}
  .add-note-mobile{display:flex!important;}
}
@media(min-width:701px){
  .note-card{display:none!important;}
  .add-note-mobile{display:none!important;}
}
.cat-pill{display:inline-block;padding:2px 7px;border-radius:12px;font-size:9px;font-weight:700;}
.cp0{background:var(--mint-l);color:#3a7a68;}
.cp1{background:var(--lav-l);color:#6b5fa0;}
.cp2{background:var(--peach-l);color:#a04040;}
.cp3{background:var(--gold-l);color:#8a6a20;}
.cp4{background:var(--border);color:var(--mid);}
.cat-select{border:none;background:transparent;font-family:'Tajawal',sans-serif;font-size:11px;color:var(--mid);cursor:pointer;outline:none;}
.monthly-table{width:100%;border-collapse:collapse;}
.monthly-table th{font-size:9px;color:var(--light);padding:6px 7px;background:var(--bg);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;text-align:center;}
.monthly-table th:first-child{text-align:right;}
.monthly-table td{padding:6px 7px;font-size:10px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;text-align:center;}
.monthly-table .rl{font-family:'Tajawal',sans-serif;font-size:11px;font-weight:700;text-align:right;}
.ri td:first-child{color:var(--sage);}.rb td:first-child{color:var(--peach);}.re td:first-child{color:#8e78c0;}
.rs td:first-child{color:var(--blue);}.rd td:first-child{color:var(--gold);}.rr td:first-child{color:var(--mint);font-weight:700;}
.footer{background:var(--dark);color:rgba(255,255,255,.3);text-align:center;padding:16px 18px;font-size:10px;line-height:2;}
.footer strong{color:var(--mint);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark);color:#fff;padding:9px 18px;border-radius:26px;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .3s;z-index:9998;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);display:inline-block;margin-right:3px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.section-title{font-size:13px;font-weight:800;color:var(--dark);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.section-title::before{content:'';display:block;width:3px;height:14px;background:var(--mint);border-radius:3px;}
[dir=ltr] .mini-table th,[dir=ltr] .notes-table th{text-align:left;}
[dir=ltr] .mini-table .lc{text-align:left;}
[dir=ltr] .mini-table .ac,[dir=ltr] .mini-table .pc{text-align:right;}
[dir=ltr] .mini-table input[type=text]{text-align:left;}
[dir=ltr] .monthly-table th:first-child,[dir=ltr] .monthly-table .rl{text-align:left;}
[dir=ltr] .kpi-card::before{right:auto;left:0;border-radius:12px 0 0 12px;}
[dir=ltr] .remaining-hero::before{right:auto;left:-40px;}
[dir=ltr] .rh-donut{left:auto;right:14px;}
[dir=ltr] .backup-btn{text-align:left;}

@media(max-width:700px){.daily-stats-row{grid-template-columns:repeat(3,1fr);}.daily-form-grid{grid-template-columns:1fr;}}
/* ══ NOTES TAB REDESIGN ══ */
.notes-pills-wrap{padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.notes-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--mid);background:var(--bg);transition:all .18s;white-space:nowrap;}
.notes-pill:hover{border-color:var(--mint);color:var(--dark);}
.notes-pill.active{background:var(--mint);border-color:var(--mint);color:var(--dark);}
.notes-add-form{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg);}
.notes-form-row{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;align-items:end;}
.nf-group{display:flex;flex-direction:column;gap:4px;}
.nf-label{font-size:10px;font-weight:600;color:var(--light);}
.nf-input{height:34px;border:1px solid var(--border);border-radius:9px;padding:0 10px;font-family:'Tajawal',sans-serif;font-size:12px;color:var(--dark);background:#fff;outline:none;width:100%;transition:border-color .2s;}
.nf-input:focus{border-color:var(--mint);}
.nf-select{height:34px;border:1px solid var(--border);border-radius:9px;padding:0 10px;font-family:'Tajawal',sans-serif;font-size:11px;color:var(--dark);background:#fff;outline:none;width:100%;cursor:pointer;}
.nf-add-btn{height:34px;background:var(--mint);color:var(--dark);border:none;border-radius:9px;padding:0 16px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;}
.nf-add-btn:hover{background:#6bbda3;transform:translateY(-1px);}
.notes-filter-bar{padding:9px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);}
.nf-month-select{border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-family:'Tajawal',sans-serif;font-size:11px;background:#fff;color:var(--dark);outline:none;cursor:pointer;}
.nf-total-badge{background:var(--mint-ll);border:1px solid var(--mint-l);border-radius:16px;padding:3px 12px;font-size:11px;font-weight:700;color:var(--dark);}
.notes-entries{padding:0;}
.note-entry-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);transition:background .15s;}
.note-entry-row:last-child{border-bottom:none;}
.note-entry-row:hover{background:var(--bg);}
.ne-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.ne-info{flex:1;min-width:0;}
.ne-title{font-size:12px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ne-sub{font-size:10px;color:var(--light);margin-top:1px;}
.ne-amount{font-family:'DM Mono',monospace;font-size:13px;font-weight:800;flex-shrink:0;}
.ne-del{background:none;border:none;color:#ddd;cursor:pointer;font-size:13px;padding:4px;flex-shrink:0;transition:color .15s;}
.ne-del:hover{color:#E8A598;}
.notes-list-footer{padding:11px 16px;background:var(--bg);border-top:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.nlf-label{font-size:11px;color:var(--light);}
.nlf-val{font-size:16px;font-weight:800;font-family:'DM Mono',monospace;color:var(--dark);}
.notes-charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.nc-bars .bar-r{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.nc-bars .bar-lbl{font-size:10px;color:var(--mid);width:70px;text-align:right;flex-shrink:0;}
.nc-bars .bar-track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden;}
.nc-bars .bar-fill{height:100%;border-radius:4px;transition:width .6s;}
.nc-bars .bar-val{font-size:10px;color:var(--mid);width:36px;text-align:left;flex-shrink:0;font-family:'DM Mono',monospace;}
@media(max-width:700px){
  .notes-form-row{grid-template-columns:1fr 1fr;gap:6px;}
  .notes-form-row .nf-add-btn{grid-column:1/-1;}
  .notes-charts-row{grid-template-columns:1fr;}
}

.cal-title{font-size:15px;font-weight:800;color:var(--dark);display:flex;align-items:center;gap:8px;}

function monthHasRealData(mk){
  const d=allData[mk];
  if(!d)return false;
  const secs=['bills','expenses','savings','debts','income'];
  const hasAny=secs.some(s=>d[s]&&d[s].length>0);
  if(!hasAny)return false;
  if(!d.bills||!d.expenses||!d.savings||!d.debts||!d.income)return false;
  return true;
}

function loadData(){
  const now = new Date();
  curYear = now.getFullYear(); 
  curMonth = now.getMonth();

  const CURRENT_VER='v33';
  const storedVer=localStorage.getItem('sf_version');
  if(storedVer!==CURRENT_VER){
    const pin=localStorage.getItem(PIN_KEY);
    const pinOn=localStorage.getItem(PINON_KEY);
    const savedLang=localStorage.getItem('sf_lang');
    localStorage.clear();
    if(pin)localStorage.setItem(PIN_KEY,pin);
    if(pinOn)localStorage.setItem(PINON_KEY,pinOn);
    if(savedLang)localStorage.setItem('sf_lang',savedLang);
    localStorage.setItem('sf_version',CURRENT_VER);
    allData={};
  }

  try{
    const s=localStorage.getItem(SK);
    if(s){
      const p=JSON.parse(s);
      allData=p.allData||{};
      currency=p.currency||'درهم';
      if(p.curYear) curYear=p.curYear;
      if(p.curMonth!==undefined) curMonth=p.curMonth;
      if(p.lang) lang=p.lang;
    }
  }catch(e){allData={};}

  const mk=ck();
  if(!monthHasRealData(mk)){
    allData[mk]=defMonth();
  }
  if(!allData[mk].notes)allData[mk].notes=[];
}

function resetDefaults(){
  const mk=ck();
  if(!allData[mk])allData[mk]={bills:[],expenses:[],savings:[],debts:[],income:[],notes:[]};
  const d=allData[mk];
  const def=defMonth();

  ['bills','expenses','savings','debts','income'].forEach(sec=>{
    if(!d[sec])d[sec]=[];
    const existingLabels=new Set(d[sec].map(r=>(r.label||'').trim().toLowerCase()));
    def[sec].forEach(defRow=>{
      const lbl=(defRow.label||'').trim().toLowerCase();
      if(!existingLabels.has(lbl)){
        d[sec].push({label:defRow.label, act:0, pln:defRow.pln});
        existingLabels.add(lbl);
      }
    });
  });

  allData[mk]=d;
  renderAll();
  persistData();
  closeModal('backupModal');
  showToast(T().toast_reset||'✅ Done');
}

function persistData(){
  try{localStorage.setItem(SK,JSON.stringify({allData,currency,curYear,curMonth,lang}));localStorage.setItem('sf_last_save',new Date().toLocaleString());}catch(e){}
  if(!_isLoadingFromCloud && _authReady && typeof _fbUid !== 'undefined' && _fbUid && typeof fbSaveToCloud === 'function'){
    fbSaveToCloud();
  }
}

function onInput(sec,idx,field,val){

  persistData();

}

function deleteRow(sec,idx){
  const mk=ck();

function getAllNotes(){
  var all=[];
  Object.keys(allData).forEach(function(mk2){
    ((allData[mk2]||{}).notes||[]).forEach(function(n){
      all.push(n);
    });
  });
  return all;
}

function getCurrentMonthNotes(){
  var ym=curYear+'-'+String(curMonth+1).padStart(2,'0');
  return getAllNotes().filter(function(n){
    return n.date&&n.date.startsWith(ym);
  });
}

function getNotesTotalsByExpLabel(){
  var notes=getCurrentMonthNotes();
  var totals={};
  notes.forEach(function(n){
    migrateNote(n);
    var sub=n.subCat||getNoteCat(n);
    var expLbl=catToExpLabel(sub);
    totals[expLbl]=(totals[expLbl]||0)+Number(n.amount||0);
  });
  return totals;
}

function renderNotesInExpenses(){
  const totals=getNotesTotalsByExpLabel();
  const tb=$('expenses-body');
  if(!tb)return;

  tb.querySelectorAll('.notes-contrib').forEach(b=>b.remove());
  tb.querySelectorAll('tr.note-row').forEach(r=>r.remove());

  const existingLabels=new Set();

  tb.querySelectorAll('tr.data-row').forEach(tr=>{
    const inputs=tr.querySelectorAll('input');
    if(inputs.length<2)return;
    const rowLabel=inputs[0].value.trim();
    existingLabels.add(rowLabel);
    const rowAct=Number(inputs[1].value)||0;

    let notesAmt=0;
    Object.entries(totals).forEach(([lbl,amt])=>{
      if(lbl.trim()===rowLabel)notesAmt+=amt;
    });

    const actInput=inputs[1];
    const oldSpan=actInput.parentNode.querySelector('.notes-total-display');
    if(oldSpan)oldSpan.remove();

    if(notesAmt>0){
      const combined=rowAct+notesAmt;
      actInput.style.display='none';
      const span=document.createElement('span');
      span.className='notes-total-display';
      span.style.cssText='font-family:"DM Mono",monospace;font-size:12px;font-weight:800;color:#E8A598;cursor:default;';
      span.title='يشمل '+fmt(notesAmt)+' من دفتر الملاحظات';
      span.textContent=fmt(combined);
      actInput.parentNode.insertBefore(span, actInput);
    } else {
      actInput.style.display='';
    }
  });

  Object.entries(totals).forEach(([lbl,total])=>{
    if(total===0||existingLabels.has(lbl))return;
    const tr=document.createElement('tr');
    tr.className='note-row';
    tr.innerHTML=`
      <td class="lc" style="font-size:11px;">📝 ${lbl}</td>
      <td class="ac" style="color:#E8A598;font-weight:800;font-family:'DM Mono',monospace;font-size:12px;">${fmt(total)}</td>
      <td class="pc" style="color:var(--light);">—</td>`;
    tb.appendChild(tr);
  });
}

function sumFromData(sec){
  const data=(allData[ck()]||{})[sec]||[];
  return data.reduce((s,r)=>({act:s.act+Number(r.act||0),pln:s.pln+Number(r.pln||0)}),{act:0,pln:0});
}

function sumExpensesWithNotes(){
  const data=(allData[ck()]||{}).expenses||[];
  const notesTotals=getNotesTotalsByExpLabel();
  let act=0,pln=0;
  data.forEach(r=>{
    const notesAmt=notesTotals[r.label.trim()]||0;
    act+=Number(r.act||0)+notesAmt;
    pln+=Number(r.pln||0);
  });
  const existingLabels=new Set(data.map(r=>r.label.trim()));
  Object.entries(notesTotals).forEach(([lbl,amt])=>{
    if(!existingLabels.has(lbl))act+=amt;
  });
  return{act,pln};
}

function recalc(){
  const t=T();
  const inc=sumFromData('income');
  const bill=sumFromData('bills');
  const exp=sumExpensesWithNotes();
  const sav=sumFromData('savings');
  const dbt=sumFromData('debts');
  const rem=inc.act-bill.act-exp.act-sav.act-dbt.act;
  const base=inc.act||1;
  const pct=v=>Math.max(0,Math.min(100,Math.round(Math.abs(v)/base*100)));

  set('v-income',fmt(inc.act));set('v-bills',fmt(bill.act));set('v-expenses',fmt(exp.act));
  set('v-savings',fmt(sav.act));set('v-debts',fmt(dbt.act));set('v-remaining',fmt(rem));
  [{k:'bills',v:bill.act},{k:'expenses',v:exp.act},{k:'savings',v:sav.act},{k:'debts',v:dbt.act},{k:'remaining',v:rem}].forEach(x=>{
    const b=$('bar-'+x.k);if(b)b.style.width=pct(x.v)+'%';
    set('p-'+x.k,pct(x.v)+'%');
  });
  set('p-income','100%');
  set('th-income',fmt(inc.act));set('th-bills',fmt(bill.act));set('th-expenses',fmt(exp.act));
  set('th-savings',fmt(sav.act));set('th-debts',fmt(dbt.act));
  set('hero-val',fmt(rem));
  set('hero-sub',`${t.from_of} ${fmt(inc.act)} ${currency}`);
  set('hero-status',rem>0?t.hero_ok:rem===0?t.hero_zero:t.hero_neg);
  if(chartDonut){chartDonut.data.datasets[0].data=[bill.act,exp.act,sav.act,dbt.act];chartDonut.update('none');}
  if(chartBar){chartBar.data.datasets[0].data=[bill.act,exp.act,sav.act,dbt.act];chartBar.data.datasets[1].data=[bill.pln,exp.pln,sav.pln,dbt.pln];chartBar.update('none');}
  if(chartHero){chartHero.data.datasets[0].data=[rem>0?rem:0,bill.act+exp.act+sav.act+dbt.act];chartHero.update('none');}
}

function migrateNote(n){
  if(n.mainCat)return n;
  const cats=getMainCats();
  const oldCat=n.cat||(n.catIdx!==undefined?LANGS[lang].cats[n.catIdx]||'':'');
  for(const mc of cats){
    if(mc.subs.includes(oldCat)){
      n.mainCat=mc.id; n.subCat=oldCat; return n;
    }
  }

function getMV(key,mi){

async function fbSaveToCloud(){
  if(!_fbUid||!window._fbDb)return;
  _isSyncing=true; setSyncStatus('sync');
  try{
    const ref=window._fbDoc(window._fbDb,'users',_fbUid);
    await window._fbSetDoc(ref,{
      allData: JSON.parse(JSON.stringify(allData)),
      currency, curYear, curMonth, lang,
      updatedAt: new Date().toISOString()
    });
    setSyncStatus('ok');
  }catch(e){
    console.error('Firestore save error:',e);
    setSyncStatus('ok');
  }
  _isSyncing=false;
}

let _isLoadingFromCloud=false;
async function fbLoadFromCloud(uid){
  if(!window._fbDb)return;
  _isLoadingFromCloud=true;
  try{
    const ref=window._fbDoc(window._fbDb,'users',uid);
    const snap=await window._fbGetDoc(ref);
    if(snap.exists()){
      const d=snap.data();
      if(d.allData)allData=d.allData;
      if(d.currency)currency=d.currency;
      if(d.curYear)curYear=d.curYear;
      if(d.curMonth!==undefined)curMonth=d.curMonth;
      if(d.lang){lang=d.lang;}
      const mk=ck();
      if(!monthHasRealData(mk))allData[mk]=defMonth();
      if(!allData[mk].notes)allData[mk].notes=[];
      
      var newestNoteYM=null;
      Object.keys(allData).forEach(function(mk2){
        ((allData[mk2]||{}).notes||[]).forEach(function(n){
          if(n.date&&n.date.length>=7){
            var nym=n.date.slice(0,7);
            if(!newestNoteYM||nym>newestNoteYM)newestNoteYM=nym;
          }
        });
      });
      if(newestNoteYM){
        var np=newestNoteYM.split('-');
        var ny=parseInt(np[0]);
        var nm=parseInt(np[1])-1;
        if(ny>curYear||(ny===curYear&&nm>curMonth)){
          curYear=ny;curMonth=nm;
        }
      }
      $('currencySelect').value=currency;
      setLang(lang);
      renderAll();
      buildMonthlyTable();
      syncCur();
      setSyncStatus('ok');
      _isLoadingFromCloud=false;
      _authReady=true;
      if(_saveQueue){_saveQueue=false;fbSaveToCloud();}
      showToast('☁️ '+(T().toast_loaded||'تم تحميل بياناتك من السحاب'));
    }else{
      _isLoadingFromCloud=false;
      _authReady=true;
      await fbSaveToCloud();
    }
  }catch(e){
    console.error('Firestore load error:',e);
    setSyncStatus('ok');
  }
}

function renderCalendar(){
  var thead=document.getElementById('cal-thead');
  var tbody=document.getElementById('cal-tbody');
  if(!thead||!tbody)return;
  var t=T();

  var DN_AR=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  var DN_FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  var DN_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DN_ES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var dayNames=lang==='fr'?DN_FR:lang==='en'?DN_EN:lang==='es'?DN_ES:DN_AR;

  thead.innerHTML='';
  var htr=document.createElement('tr');
  dayNames.forEach(function(d){
    var th=document.createElement('th');th.textContent=d;htr.appendChild(th);
  });
  thead.appendChild(htr);

  var calMonthStr=String(curMonth+1).padStart(2,'0');
  var dayTotals={};
  Object.keys(allData).forEach(function(mk2){
    ((allData[mk2]||{}).notes||[]).forEach(function(n){
      if(!n.date||!Number(n.amount||0))return;
      var parts=n.date.split('-');
      if(!parts[1])return;
      var noteYear=parseInt(parts[0]);
      var noteMonth=parts[1];
      if(noteMonth===calMonthStr&&noteYear===curYear){
        dayTotals[n.date]=(dayTotals[n.date]||0)+Number(n.amount);
      }
    });
  });

  var monthTotal=Object.values(dayTotals).reduce(function(s,v){return s+v;},0);
  var elTot=document.getElementById('cal-total-val');
  if(elTot)elTot.textContent=fmt(monthTotal);
  var elCur=document.getElementById('cal-cur');
  if(elCur)elCur.textContent=currency;

  var vals=Object.values(dayTotals).filter(function(v){return v>0;});
  var maxVal=Math.max.apply(null,vals.concat([1]));

  tbody.innerHTML='';
  var firstDt=new Date(curYear,curMonth,1);
  var firstDow=firstDt.getDay(); 
  var lastDate=new Date(curYear,curMonth+1,0).getDate();
  var _td=new Date();
  var todayKey=_td.getFullYear()+'-'+String(_td.getMonth()+1).padStart(2,'0')+'-'+String(_td.getDate()).padStart(2,'0');

  var tr=document.createElement('tr');
  var col=0;

  for(var e=0;e<firstDow;e++){
    var td=document.createElement('td');td.className='empty';
    tr.appendChild(td);col++;
  }

  for(var d=1;d<=lastDate;d++){
    var dk=curYear+'-'+String(curMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var val=dayTotals[dk]||0;
    var isToday=dk===todayKey;
    var pct=val/maxVal;

    var color='';
    if(val>0){
      color=pct<0.33?'#22c55e':pct<0.66?'#f59e0b':'#ef4444';
    }

    var td2=document.createElement('td');
    if(isToday)td2.className='today-cell';

    var numDiv=document.createElement('div');
    numDiv.className='cal-day-num';
    numDiv.textContent=d;
    td2.appendChild(numDiv);

    if(val>0&&val!==undefined){
      var amtDiv=document.createElement('div');
      amtDiv.className='cal-day-amount';
      amtDiv.style.color=color;
      amtDiv.textContent=fmt(val);
      td2.appendChild(amtDiv);

      var bar=document.createElement('div');
      bar.className='cal-day-bar';
      bar.style.background=color;
      td2.appendChild(bar);
    }

    td2.title=t.months[curMonth]+' '+d+(val>0?' — '+fmt(val)+' '+currency:'');
    tr.appendChild(td2);
    col++;

    if(col%7===0){
      tbody.appendChild(tr);
      tr=document.createElement('tr');
    }
  }

  while(col%7!==0){
    var tdx=document.createElement('td');tdx.className='empty';
    tr.appendChild(tdx);col++;
  }
  if(tr.children.length>0)tbody.appendChild(tr);

  var titleEl=document.getElementById('cal-title-lbl');
  if(titleEl){
    var prefix=lang==='fr'?'Résumé ':lang==='en'?'Summary ':lang==='es'?'Resumen ':'ملخص مصاريف ';
    titleEl.textContent=prefix+t.months[curMonth]+' '+curYear;
  }
}

function getDriveData(){
  return (allData[ck()]||{}).driveEntries||[];
}

function addDriveEntry(){
  const date=document.getElementById('drive-date').value;
  const trips=Number(document.getElementById('drive-trips').value)||0;
  const total=Number(document.getElementById('drive-total').value)||0;
  if(!date||trips<=0||total<=0){showToast('❌ '+(T().drive_fill||'أكمل كل الحقول'));return;}
  const mk=ck();
  if(!allData[mk])allData[mk]=defMonth();
  if(!allData[mk].driveEntries)allData[mk].driveEntries=[];
  allData[mk].driveEntries.push({date,trips,total,avg:Math.round(total/trips)});
  syncDriveToIncome();
  persistData();
  document.getElementById('drive-trips').value='';
  document.getElementById('drive-total').value='';
  renderDriveTab();
  showToast(T().toast_add||'✓');
}

function syncDriveToIncome(){
  const mk=ck();
  const entries=getDriveData();
  const monthTotal=entries.reduce(function(s,e){return s+Number(e.total||0);},0);
  const income=allData[mk].income||[];
  let found=false;
  income.forEach(function(row){
    if(row.label==='عمل ثاني'||row.label==='2ème emploi'||row.label==='2nd job'||row.label==='2º trabajo'||row.label==='خدمة ثانية'){
      row.act=monthTotal;found=true;
    }
  });
  if(!found&&income.length>1){income[1].act=monthTotal;}
  renderSection('income');
  recalc();
}

function deleteDriveEntry(idx){
  const mk=ck();
  if(!allData[mk]||!allData[mk].driveEntries)return;
  allData[mk].driveEntries.splice(idx,1);
  syncDriveToIncome();
  persistData();
  renderDriveTab();
}

function renderDriveTab(){
  const panel=document.getElementById('tab-drive');
  if(!panel||!panel.classList.contains('active'))return;
  const t=T();
  const entries=getDriveData();

  const todayKey=new Date().toISOString().slice(0,10);
  const todayEntries=entries.filter(function(e){return e.date===todayKey;});
  const todayTotal=todayEntries.reduce(function(s,e){return s+e.total;},0);
  const todayTrips=todayEntries.reduce(function(s,e){return s+e.trips;},0);

  const now=new Date();
  const ws=new Date(now);ws.setDate(now.getDate()-now.getDay());
  const weekTotal=entries.filter(function(e){
    const d=new Date(e.date);return d>=ws&&d<=now;
  }).reduce(function(s,e){return s+e.total;},0);

  const monthTotal=entries.reduce(function(s,e){return s+e.total;},0);
  const monthTrips=entries.reduce(function(s,e){return s+e.trips;},0);
  const avgPerTrip=monthTrips>0?Math.round(monthTotal/monthTrips):0;

  var el;
  el=document.getElementById('drv-today');if(el)el.textContent=fmt(todayTotal);
  el=document.getElementById('drv-week');if(el)el.textContent=fmt(weekTotal);
  el=document.getElementById('drv-month');if(el)el.textContent=fmt(monthTotal);
  el=document.getElementById('drv-avg');if(el)el.textContent=fmt(avgPerTrip);
  el=document.getElementById('drv-trips');if(el)el.textContent=monthTrips;

  const dateInput=document.getElementById('drive-date');
  if(dateInput&&!dateInput.value)dateInput.value=todayKey;

  renderDriveWeekBars(entries,ws,now);
  renderDriveList(entries);
}

function renderDriveWeekBars(entries,ws,now){
  const bars=document.getElementById('drive-week-bars');
  if(!bars)return;
  bars.innerHTML='';
  const dayNames=lang==='fr'?['D','L','M','M','J','V','S']:
                 lang==='en'?['S','M','T','W','T','F','S']:
                 lang==='es'?['D','L','M','X','J','V','S']:
                 ['أح','اث','ثل','أر','خم','جم','سب'];
  const vals=Array.from({length:7},function(_,i){
    const wd=new Date(ws);wd.setDate(ws.getDate()+i);
    const dk=wd.toISOString().slice(0,10);
    return entries.filter(function(e){return e.date===dk;}).reduce(function(s,e){return s+e.total;},0);
  });
  const maxVal=Math.max.apply(null,vals.concat([1]));
  const todayDow=new Date().getDay();
  vals.forEach(function(val,i){
    const isToday=i===todayDow;
    const pct=Math.max(4,Math.round((val/maxVal)*100));
    const item=document.createElement('div');
    item.style.cssText='flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;';
    const track=document.createElement('div');
    track.style.cssText='width:100%;height:80px;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden;';
    const fill=document.createElement('div');
    fill.style.cssText='width:100%;height:'+pct+'%;background:'+(isToday?'var(--mint)':'var(--lav)')+';border-radius:8px;min-height:4px;transition:height .5s;';
    track.appendChild(fill);
    const lbl=document.createElement('div');
    lbl.style.cssText='font-size:9px;color:'+(isToday?'var(--mint)':'var(--light)')+';font-weight:'+(isToday?'800':'600')+';text-align:center;';
    lbl.textContent=dayNames[i];
    const valLbl=document.createElement('div');
    valLbl.style.cssText='font-size:8px;color:var(--mid);font-family:"DM Mono",monospace;';
    valLbl.textContent=val>0?fmt(val):';
    item.appendChild(track);item.appendChild(valLbl);item.appendChild(lbl);
    bars.appendChild(item);
  });
}

function initNotesMonthFilter(){
  var sel=document.getElementById('nf-month-filter');
  if(!sel)return;
  sel.innerHTML='';
  var months=new Set();
  var displayYM=curYear+'-'+String(curMonth+1).padStart(2,'0');
  months.add(displayYM);
  Object.keys(allData).forEach(function(k){
    ((allData[k]||{}).notes||[]).forEach(function(n){
      if(n.date&&n.date.length>=7)months.add(n.date.slice(0,7));
    });
  });
  var t=T();
  var sorted=Array.from(months).sort().reverse();
  var latestWithNotes=null;
  sorted.forEach(function(ym){
    if(latestWithNotes)return;
    var hasNotes=false;
    Object.keys(allData).forEach(function(k){
      ((allData[k]||{}).notes||[]).forEach(function(n){
        if(n.date&&n.date.startsWith(ym)&&Number(n.amount||0)>0)hasNotes=true;
      });
    });
    if(hasNotes)latestWithNotes=ym;
  });
  var defaultYM=latestWithNotes||displayYM;
  sorted.forEach(function(ym){
    var parts=ym.split('-');
    var mIdx=parseInt(parts[1])-1;
    var opt=document.createElement('option');
    opt.value=ym;
    opt.textContent=t.months[mIdx]+' '+parts[0];
    if(ym===defaultYM)opt.selected=true;
    sel.appendChild(opt);
  });
  _noteFilterMonth=defaultYM;
}

      if(!allData[mk2]||!allData[mk2].notes)return;
      allData[mk2].notes.splice(idx2,1);
      persistData();renderNotesTab();renderNotesInExpenses();recalc();
    };})(realMk,realIdx);

    row.appendChild(icon);row.appendChild(info);row.appendChild(amt);row.appendChild(del);
    listEl.appendChild(row);
  });

  renderNotesCatBars(filtered);
  if(footerVal){
    footerVal.innerHTML=fmt(total)+' <span style="font-size:11px;font-weight:400;color:var(--light);">'+currency+'</span>';
  }
}

function renderNotesCatBars(filtered){
  var barsEl=document.getElementById('notes-cat-bars');
  if(!barsEl)return;
  barsEl.innerHTML='';
  var bycat={};
  filtered.forEach(function(obj){
    var mc=getMainCats().find(function(c){return c.id===obj.n.mainCat;})||getMainCats()[0];
    var lbl=mc.icon+' '+mc.label;
    bycat[lbl]=(bycat[lbl]||{total:0,color:CAT_COLOR[mc.id]||'var(--mint)',id:mc.id});
    bycat[lbl].total+=Number(obj.n.amount||0);
  });
  var maxVal=Math.max.apply(null,Object.values(bycat).map(function(v){return v.total;}).concat([1]));
  Object.entries(bycat).sort(function(a,b){return b[1].total-a[1].total;}).forEach(function(entry){
    var lbl=entry[0];var v=entry[1];
    var pct=Math.round(v.total/maxVal*100);
    var row=document.createElement('div');
    row.className='bar-r';
    row.innerHTML='<span class="bar-lbl" style="font-size:10px;color:var(--mid);width:80px;text-align:right;flex-shrink:0;">'+lbl+'</span>'
      +'<div class="bar-track" style="flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden;">'
      +'<div class="bar-fill" style="width:'+pct+'%;background:'+v.color+';height:100%;border-radius:4px;transition:width .5s;"></div></div>'
      +'<span class="bar-val" style="font-size:10px;color:var(--mid);width:40px;text-align:left;font-family:DM Mono,monospace;">'+fmt(v.total)+'</span>';
    barsEl.appendChild(row);
  });
  updateNotesChart2(bycat);
}

function updateNotesChart2(bycat){
  if(!chartNotes)return;
  var keys=Object.keys(bycat);
  var vals=keys.map(function(k){return bycat[k].total;});
  var colors=Object.values(bycat).map(function(v){return v.color;});
  if(!keys.length)return;
  chartNotes.data.labels=keys;
  chartNotes.data.datasets[0].data=vals;
  chartNotes.data.datasets[0].backgroundColor=colors;
  chartNotes.update('none');
}

function renderNotesTab(){
  initNotesPills();
  initNotesMonthFilter();
  var dateEl=document.getElementById('nf-date');
  if(dateEl&&!dateEl.value){
    var _nd=new Date();
    dateEl.value=_nd.getFullYear()+'-'+String(_nd.getMonth()+1).padStart(2,'0')+'-'+String(_nd.getDate()).padStart(2,'0');
  }
  updateNoteSubSelect();
  renderNotesList();
}

document.addEventListener('DOMContentLoaded',()=>{
  $('landing-page').style.display='block';
  $('pin-screen').classList.add('hidden'); 
  ['.header','.nav-tabs','.footer'].forEach(s=>{
    const el=document.querySelector(s);if(el)el.style.display='none';
  });
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
  sessionStorage.removeItem('show_landing');
  initCharts();
  setTimeout(initLandingCharts, 200);
});
</script>
