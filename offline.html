<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7EC8B0">
  <title>Tadbir — Hors ligne</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151923;color:#fff;font-family:Arial,sans-serif;text-align:center}
    main{max-width:360px;padding:32px}.logo{font-size:64px}h1{margin:12px 0;color:#7EC8B0}p{line-height:1.6;color:#b8bdc9}
    button{border:0;border-radius:10px;background:#7EC8B0;color:#151923;padding:12px 22px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo">💰</div>
    <h1>Tadbir</h1>
    <p>Vous êtes hors ligne. Les données déjà enregistrées restent disponibles lorsque l’application a été ouverte au moins une fois sur cet appareil.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
